<!doctype html>
<html lang="fa" dir="rtl" class="light" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>هدهد</title>
    <!-- Boot splash: shown from the first paint and replaced by React; src/shared/components/FullScreenLoader.tsx reuses these classes. -->
    <style>
      .boot-loader {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        background: #f8f8f8;
      }
      .boot-loader img {
        width: 76px;
        height: 76px;
        user-select: none;
      }
      .boot-spinner {
        width: 28px;
        height: 28px;
        border: 3px solid #e2e2e3;
        border-top-color: #0485f7;
        border-radius: 50%;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body class="bg-background text-foreground">
    <div id="root">
      <div class="boot-loader" role="status" aria-busy="true">
        <img src="/loader-avatar.svg" alt="" draggable="false" />
        <span class="boot-spinner"></span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
